<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mini Calendar</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      background: transparent;
      font-family: Arial, "Hiragino Kaku Gothic ProN", sans-serif;
    }

    .calendar {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #ABE1FA;
    }

    /* 上の月表示部分 */
    .header {
      background: #65BBE9;
      color: white;
      padding: 14px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .month-title {
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      flex: 1;
    }

    .month-button {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .month-button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* 曜日 */
    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      padding: 14px 12px 6px;
      text-align: center;
      font-weight: bold;
      color: #65BBE9;
    }

    .sat {
      color: #73C2FB;
    }

    .sun {
      color: #E58C98;
    }

    /* 日付 */
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      padding: 8px 12px 14px;
      gap: 6px 0;
    }

    .day {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    /* 今日 */
    .today {
      width: 25px;
      height: 25px;
      background: #ABE1FA;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto;
    }

    /* 今日ボタン */
    .today-button-area {
      text-align: center;
      padding: 0 0 14px;
    }

    #todayButton {
      border: none;
      background: #72C6EF;
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
    }

    #todayButton:hover {
      background: #65BBE9;
    }
  </style>
</head>

<body>

  <div class="calendar">

    <div class="header">
      <button class="month-button" id="prevMonth">＜</button>

      <div class="month-title" id="month"></div>

      <button class="month-button" id="nextMonth">＞</button>
    </div>

    <div class="weekdays">
      <div>月</div>
      <div>火</div>
      <div>水</div>
      <div>木</div>
      <div>金</div>
      <div class="sat">土</div>
      <div class="sun">日</div>
    </div>

    <div class="days" id="days"></div>

    <div class="today-button-area">
      <button id="todayButton">今日</button>
    </div>

  </div>

  <script>
    const monthElement = document.getElementById("month");
    const daysContainer = document.getElementById("days");
    const prevMonthButton = document.getElementById("prevMonth");
    const nextMonthButton = document.getElementById("nextMonth");
    const todayButton = document.getElementById("todayButton");

    const today = new Date();

    let currentDate = new Date(
      today.getFullYear(),
      today.getMonth(),
      1
    );

    function renderCalendar() {

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      monthElement.textContent =
        `${year}年 ${month + 1}月`;

      daysContainer.innerHTML = "";

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(
        year,
        month + 1,
        0
      ).getDate();

      /* 月曜日始まりに変換 */
      const startDay = (firstDay + 6) % 7;

      /* 月初めの空白 */
      for (let i = 0; i < startDay; i++) {
        const empty = document.createElement("div");
        empty.className = "day";
        daysContainer.appendChild(empty);
      }

      /* 日付を作成 */
      for (let day = 1; day <= lastDate; day++) {

        const dayElement = document.createElement("div");
        dayElement.className = "day";

        const isToday =
          year === today.getFullYear() &&
          month === today.getMonth() &&
          day === today.getDate();

        if (isToday) {
          const todayCircle =
            document.createElement("div");

          todayCircle.className = "today";
          todayCircle.textContent = day;

          dayElement.appendChild(todayCircle);

        } else {
          dayElement.textContent = day;
        }

        daysContainer.appendChild(dayElement);
      }
    }

    /* 前の月 */
    prevMonthButton.addEventListener("click", function () {
      currentDate.setMonth(
        currentDate.getMonth() - 1
      );

      renderCalendar();
    });

    /* 次の月 */
    nextMonthButton.addEventListener("click", function () {
      currentDate.setMonth(
        currentDate.getMonth() + 1
      );

      renderCalendar();
    });

    /* 今日の月に戻る */
    todayButton.addEventListener("click", function () {
      currentDate = new Date(
        today.getFullYear(),
        today.getMonth(),
        1
      );

      renderCalendar();
    });

    renderCalendar();
  </script>

</body>
</html>
