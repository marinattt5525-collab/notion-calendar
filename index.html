<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mini Calendar</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, "Hiragino Kaku Gothic ProN", sans-serif;
      background: transparent;
    }

    .calendar {
      width: 100%;
      max-width: 520px;
      background: #FFFFFF;
      border: 2px solid #73C2FB;
      border-radius: 14px;
      overflow: hidden;
    }

    /* ヘッダー */
    .header {
      background: #65BBE9;
      color: white;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .month-title {
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      flex: 1;
    }

    .month-button {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: white;
      font-size: 18px;
      cursor: pointer;
      border-radius: 50%;
    }

    .month-button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* 曜日 */
    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      padding: 8px 20px 3px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
    }

    .weekday {
      color: #65BBE9;
    }

    .sat {
      color: #73C2FB;
    }

    .sun {
      color: #E99AA8;
    }

    /* 日付 */
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      padding: 3px 20px 8px;
      gap: 0;
    }

    .day {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555555;
      font-size: 16px;
      cursor: pointer;
    }

    .day.empty {
      cursor: default;
    }

    .day.saturday {
      color: #73C2FB;
    }

    .day.sunday {
      color: #E99AA8;
    }

    /* 選択した日 */
    .selected {
      width: 25px;
      height: 25px;
      background: #ABE1FA;
      color: #3D7FA8;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="calendar">

    <div class="header">
      <button class="month-button" id="prevMonth">＜</button>
      <div class="month-title" id="month"></div>
      <button class="month-button" id="nextMonth">＞</button>
    </div>

    <div class="weekdays">
      <div class="weekday">月</div>
      <div class="weekday">火</div>
      <div class="weekday">水</div>
      <div class="weekday">木</div>
      <div class="weekday">金</div>
      <div class="sat">土</div>
      <div class="sun">日</div>
    </div>

    <div class="days" id="days"></div>

  </div>

  <script>
    const monthElement = document.getElementById("month");
    const daysContainer = document.getElementById("days");
    const prevMonthButton = document.getElementById("prevMonth");
    const nextMonthButton = document.getElementById("nextMonth");

    const today = new Date();

    let currentDate = new Date(
      today.getFullYear(),
      today.getMonth(),
      1
    );

    let selectedDate = new Date(
      today.getFullYear(),
      today.getMonth(),
      today.getDate()
    );

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      monthElement.textContent = `${year}年 ${month + 1}月`;

      daysContainer.innerHTML = "";

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      const startDay = (firstDay + 6) % 7;

      for (let i = 0; i < startDay; i++) {
        const empty = document.createElement("div");
        empty.className = "day empty";
        daysContainer.appendChild(empty);
      }

      for (let day = 1; day <= lastDate; day++) {
        const date = new Date(year, month, day);
        const dayElement = document.createElement("div");

        dayElement.className = "day";

        const dayOfWeek = date.getDay();

        if (dayOfWeek === 6) {
          dayElement.classList.add("saturday");
        }

        if (dayOfWeek === 0) {
          dayElement.classList.add("sunday");
        }

        const isSelected =
          date.getFullYear() === selectedDate.getFullYear() &&
          date.getMonth() === selectedDate.getMonth() &&
          date.getDate() === selectedDate.getDate();

        if (isSelected) {
          const circle = document.createElement("div");
          circle.className = "selected";
          circle.textContent = day;
          dayElement.appendChild(circle);
        } else {
          dayElement.textContent = day;
        }

        dayElement.addEventListener("click", function () {
          selectedDate = new Date(year, month, day);
          renderCalendar();
        });

        daysContainer.appendChild(dayElement);
      }
    }

    prevMonthButton.addEventListener("click", function () {
      currentDate = new Date(
        currentDate.getFullYear(),
        currentDate.getMonth() - 1,
        1
      );

      renderCalendar();
    });

    nextMonthButton.addEventListener("click", function () {
      currentDate = new Date(
        currentDate.getFullYear(),
        currentDate.getMonth() + 1,
        1
      );

      renderCalendar();
    });

    renderCalendar();
  </script>

</body>
</html>
