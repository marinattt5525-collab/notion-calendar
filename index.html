<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mini Calendar</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      background: transparent;
      font-family: Arial, "Hiragino Kaku Gothic ProN", sans-serif;
    }

    .calendar {
      width: 100%;
      max-width: 420px;
      background: #FFFFFF;
      border-radius: 14px;
      overflow: hidden;
    }

    /* ヘッダー */
    .header {
      background: #65BBE9;
      color: white;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .month-title {
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      flex: 1;
    }

    /* 月変更ボタン */
    .month-button {
      width: 30px;
      height: 30px;
      border: none;
      background: transparent;
      color: white;
      font-size: 20px;
      cursor: pointer;
      border-radius: 50%;
    }

    .month-button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* 曜日 */
    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      padding: 12px 10px 5px;
      text-align: center;
      font-size: 13px;
      font-weight: bold;
    }

    .weekday {
      color: #65BBE9;
    }

    .sat {
      color: #73C2FB;
    }

    .sun {
      color: #E99AA8;
    }

    /* 日付 */
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      padding: 5px 10px 10px;
      gap: 4px 0;
    }

    .day {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555555;
      font-size: 14px;
      cursor: pointer;
    }

    .day.empty {
      cursor: default;
    }

    .day.saturday {
      color: #73C2FB;
    }

    .day.sunday {
      color: #E99AA8;
    }

    /* 選択されている日 */
    .selected {
      width: 25px;
      height: 25px;
      background: #ABE1FA;
      color: #3D7FA8;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* 今日ボタン */
    .today-button-area {
      text-align: center;
      padding: 2px 0 12px;
    }

    #todayButton {
      border: none;
      background: #72C6EF;
      color: white;
      padding: 5px 16px;
      border-radius: 15px;
      cursor: pointer;
      font-size: 13px;
    }

    #todayButton:hover {
      background: #65BBE9;
    }
  </style>
</head>

<body>

  <div class="calendar">

    <div class="header">
      <button class="month-button" id="prevMonth">＜</button>

      <div class="month-title" id="month"></div>

      <button class="month-button" id="nextMonth">＞</button>
    </div>

    <div class="weekdays">
      <div class="weekday">月</div>
      <div class="weekday">火</div>
      <div class="weekday">水</div>
      <div class="weekday">木</div>
      <div class="weekday">金</div>
      <div class="sat">土</div>
      <div class="sun">日</div>
    </div>

    <div class="days" id="days"></div>

    <div class="today-button-area">
      <button id="todayButton">今日</button>
    </div>

  </div>

  <script>
    const monthElement = document.getElementById("month");
    const daysContainer = document.getElementById("days");

    const prevMonthButton = document.getElementById("prevMonth");
    const nextMonthButton = document.getElementById("nextMonth");
    const todayButton = document.getElementById("todayButton");

    /* 実際の今日 */
    const today = new Date();

    /* 現在表示している月 */
    let currentDate = new Date(
      today.getFullYear(),
      today.getMonth(),
      1
    );

    /* 選択されている日 */
    let selectedDate = new Date(
      today.getFullYear(),
      today.getMonth(),
      today.getDate()
    );


    function renderCalendar() {

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      /* ヘッダーの年月 */
      monthElement.textContent =
        `${year}年 ${month + 1}月`;

      /* 一度カレンダーを空にする */
      daysContainer.innerHTML = "";

      /* 1日の曜日 */
      const firstDay =
        new Date(year, month, 1).getDay();

      /* 月末の日 */
      const lastDate =
        new Date(year, month + 1, 0).getDate();

      /* 月曜始まりに変換 */
      const startDay = (firstDay + 6) % 7;


      /* 月初めの空白 */
      for (let i = 0; i < startDay; i++) {

        const empty =
          document.createElement("div");

        empty.className = "day empty";

        daysContainer.appendChild(empty);
      }


      /* 日付を作る */
      for (let day = 1; day <= lastDate; day++) {

        const date = new Date(year, month, day);

        const dayElement =
          document.createElement("div");

        dayElement.className = "day";

        /* 土日 */
        const dayOfWeek = date.getDay();

        if (dayOfWeek === 6) {
          dayElement.classList.add("saturday");
        }

        if (dayOfWeek === 0) {
          dayElement.classList.add("sunday");
        }


        /* 選択中か確認 */
        const isSelected =
          date.getFullYear() === selectedDate.getFullYear() &&
          date.getMonth() === selectedDate.getMonth() &&
          date.getDate() === selectedDate.getDate();


        if (isSelected) {

          const circle =
            document.createElement("div");

          circle.className = "selected";
          circle.textContent = day;

          dayElement.appendChild(circle);

        } else {

          dayElement.textContent = day;
        }


        /* 日付をクリック */
        dayElement.addEventListener(
          "click",
          function () {

            selectedDate =
              new Date(year, month, day);

            renderCalendar();
          }
        );


        daysContainer.appendChild(dayElement);
      }
    }


    /* 前の月 */
    prevMonthButton.addEventListener(
      "click",
      function () {

        currentDate =
          new Date(
            currentDate.getFullYear(),
            currentDate.getMonth() - 1,
            1
          );

        renderCalendar();
      }
    );


    /* 次の月 */
    nextMonthButton.addEventListener(
      "click",
      function () {

        currentDate =
          new Date(
            currentDate.getFullYear(),
            currentDate.getMonth() + 1,
            1
          );

        renderCalendar();
      }
    );


    /* 今日に戻る */
    todayButton.addEventListener(
      "click",
      function () {

        currentDate =
          new Date(
            today.getFullYear(),
            today.getMonth(),
            1
          );

        selectedDate =
          new Date(
            today.getFullYear(),
            today.getMonth(),
            today.getDate()
          );

        renderCalendar();
      }
    );


    /* 最初に表示 */
    renderCalendar();

  </script>

</body>
</html>
